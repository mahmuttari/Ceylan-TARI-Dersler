<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sihirbazın Şapkası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#ffe8a3;
    font-family:"Fredoka","Comic Sans MS","Chalkboard SE","Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;
    color:#3b2a5a;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  /* ---------- sirk arka planı ---------- */
  #bg{position:fixed;inset:0;z-index:0;overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 120%,#ffd27a 0%,#ffb84d 35%,transparent 60%),
      repeating-linear-gradient(90deg,#ff5d5d 0 60px,#fff3e0 60px 120px)}
  #bg::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;
    background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,0) 55%,rgba(255,255,255,.35) 100%)}
  #bg::after{content:"";position:absolute;left:0;right:0;top:34%;bottom:0;
    background:linear-gradient(180deg,#ffe8a3 0%,#ffd27a 60%,#f2b35a 100%)}
  .flags{position:fixed;left:0;right:0;top:0;height:60px;z-index:1;display:flex;justify-content:space-around;pointer-events:none}
  .flags i{display:block;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--c);
    margin-top:8px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));animation:sway 3s ease-in-out infinite}
  .flags i:nth-child(odd){animation-delay:.6s}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

  /* ---------- kartlar / kaplamalar ---------- */
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;
    background:rgba(60,30,90,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow:auto}
  .overlay.hidden{display:none}
  .card{background:rgba(255,255,255,.96);border-radius:28px;padding:24px 24px 26px;max-width:640px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(40,20,80,.4),inset 0 0 0 6px #fff}
  .teacher{font-size:clamp(18px,3.2vw,24px);font-weight:700;letter-spacing:.3px;color:#fff;line-height:1.05;
    background:linear-gradient(135deg,#ff7b2e 0%,#ff9f1c 55%,#ffc233 100%);
    border:3px solid #fff;border-radius:16px;padding:8px 20px 10px;display:inline-block;margin-bottom:12px;
    text-shadow:0 2px 0 #b84a0c,0 4px 10px rgba(0,0,0,.2);box-shadow:0 6px 16px rgba(184,74,12,.3),0 0 0 3px #ffd166}
  .teacher small{display:block;font-size:.55em;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#fff7e6;text-shadow:0 2px 0 #b84a0c;margin-bottom:3px}
  h1{margin:4px 0 2px;font-size:clamp(28px,5.5vw,46px);line-height:1.05;color:#5a2d91}
  .sub{margin:0 0 14px;font-size:clamp(15px,2.4vw,19px);color:#7a5aa5;font-weight:600}
  .lbl{font-weight:700;color:#5a2d91;margin:10px 0 6px;font-size:clamp(14px,2.2vw,17px)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:4px}
  .chip{font-family:"OkulHarf","Fredoka",sans-serif;font-size:clamp(20px,3.4vw,28px);font-weight:700;min-width:48px;padding:6px 10px;border-radius:14px;
    border:3px solid #d9cdf0;background:#f4f0fb;color:#8a7aa8;cursor:pointer;line-height:1}
  .chip.on{background:#ffd166;border-color:#ff9f1c;color:#5a2d91;box-shadow:0 4px 0 #e08a00}
  .chip.v.on{background:#8ecae6;border-color:#2b9bd6;box-shadow:0 4px 0 #1b6fa0}
  .opts{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;align-items:center;margin:12px 0 16px;font-weight:600;font-size:clamp(14px,2.2vw,17px)}
  .opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .opts input[type=checkbox]{width:22px;height:22px;accent-color:#ff9f1c}
  .seg{display:inline-flex;border:3px solid #d9cdf0;border-radius:999px;overflow:hidden}
  .seg button{font:inherit;font-weight:700;border:0;background:#f4f0fb;color:#8a7aa8;padding:6px 14px;cursor:pointer}
  .seg button.on{background:#5a2d91;color:#fff}
  .btn{font:inherit;font-size:clamp(20px,3.6vw,30px);font-weight:800;color:#fff;border:0;cursor:pointer;
    background:linear-gradient(180deg,#ff9f43,#ff6b35);border-radius:999px;padding:14px 38px;
    box-shadow:0 8px 0 #c74d1f,0 14px 30px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(6px);box-shadow:0 2px 0 #c74d1f,0 6px 14px rgba(0,0,0,.25)}
  .btn.alt{background:linear-gradient(180deg,#4fd1c5,#1fa2b8);box-shadow:0 8px 0 #137488,0 14px 30px rgba(0,0,0,.25)}
  .btn.alt:active{box-shadow:0 2px 0 #137488,0 6px 14px rgba(0,0,0,.25)}
  .warn{color:#c0392b;font-weight:700;margin-top:10px;min-height:1.2em;font-size:clamp(14px,2.2vw,17px)}
  #heceList{font-family:"OkulHarf","Fredoka",sans-serif;font-size:clamp(20px,3.4vw,28px);font-weight:700;color:#5a2d91;width:100%;
    border:3px solid #d9cdf0;border-radius:16px;padding:8px 14px;background:#f4f0fb;resize:vertical;text-align:center;line-height:1.4}
  #heceList:focus{outline:none;border-color:#ff9f1c}

  /* ---------- oyun ---------- */
  #game{position:fixed;inset:0;z-index:2;display:none}
  #game.on{display:block}
  #hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;z-index:5}
  .pill{background:rgba(255,255,255,.92);border-radius:18px;padding:8px 14px;box-shadow:0 6px 18px rgba(60,30,90,.25);
    font-weight:800;font-size:clamp(16px,2.6vw,22px);color:#5a2d91;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .pill .num{font-size:1.5em;color:#ff9f1c;text-shadow:0 2px 0 rgba(0,0,0,.12)}
  .iconbtn{background:rgba(255,255,255,.92);border:0;border-radius:50%;width:48px;height:48px;font-size:24px;cursor:pointer;box-shadow:0 6px 18px rgba(60,30,90,.25)}
  #stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  #cardArea{position:absolute;left:0;right:0;top:12%;height:38%;display:flex;align-items:center;justify-content:center;pointer-events:none}
  #hece{font-family:"OkulHarf","Fredoka","Arial Rounded MT Bold",sans-serif;font-weight:700;color:#3b2a5a;
    font-size:clamp(84px,22vmin,220px);line-height:1;letter-spacing:.04em;
    background:#fff;border-radius:34px;padding:.1em .35em .14em;border:6px solid #ffd166;
    box-shadow:0 20px 50px rgba(60,30,90,.35),0 0 0 8px rgba(255,255,255,.6);opacity:0;transform:scale(.2);
    pointer-events:none}
  #hece.sayi{border-color:#2b9bd6;color:#1b4f8a}
  #hece small{display:block;font-family:"Fredoka",sans-serif;font-size:.22em;color:#2b9bd6;letter-spacing:.15em;line-height:1.1;margin-top:.05em}
  #hece.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1) forwards}
  #hece.fly{animation:fly .55s ease-in forwards}
  @keyframes pop{0%{opacity:0;transform:translateY(34vh) scale(.15) rotate(-12deg)}60%{opacity:1;transform:translateY(-4vh) scale(1.08) rotate(3deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
  @keyframes fly{0%{opacity:1;transform:translateY(0) scale(1) rotate(0)}100%{opacity:0;transform:translate(60vw,-30vh) scale(.6) rotate(25deg)}}
  #clownWrap{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:56%;max-height:620px;width:auto;aspect-ratio:360/440;cursor:pointer}
  #clown{width:100%;height:100%;display:block;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  #wand{transform-origin:76px 160px}
  #clownWrap.open #wand{animation:wave .7s ease-in-out}
  @keyframes wave{0%,100%{transform:rotate(0)}30%{transform:rotate(-40deg)}65%{transform:rotate(25deg)}}
  .blink{animation:blink 4s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  .spark{position:absolute;width:12px;height:12px;border-radius:50%;pointer-events:none;animation:spark .9s ease-out forwards}
  @keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  #mainBtn{position:absolute;right:16px;bottom:16px;z-index:6;font-size:clamp(18px,3.4vw,28px);padding:14px 26px}
  #hint{position:absolute;left:16px;bottom:16px;z-index:4;background:rgba(255,255,255,.85);border-radius:999px;
    padding:8px 16px;font-weight:700;color:#5a2d91;font-size:clamp(13px,2.2vw,17px);white-space:nowrap;pointer-events:none}
  @media (max-width:600px){#hint{display:none} #mainBtn{right:50%;transform:translateX(50%);bottom:12px;white-space:nowrap} #clownWrap{height:44%} #cardArea{top:14%;height:36%}}
  #confetti{position:fixed;inset:0;z-index:30;pointer-events:none}
  .biglet{font-family:"OkulHarf","Fredoka",sans-serif;font-size:clamp(28px,6vw,52px);line-height:1.3;font-weight:700;margin:6px 0;color:#ff6b35;text-shadow:0 4px 0 #c74d1f}
</style>
</head>
<body>
<div id="bg"></div>
<div class="flags" id="flags"></div>

<!-- ---------- GİRİŞ / AYARLAR ---------- -->
<div id="intro" class="overlay">
  <div class="card">
    <div class="teacher"><small>1/C Sınıf Öğretmeni</small>Ceylan Tarı</div>
    <h1>🎩 Sihirbazın Şapkası</h1>
    <p class="sub">Hece Okuma Oyunu</p>
    <div class="lbl">Öğrendiğimiz harfler (dokunarak seç):</div>
    <div class="chips" id="vowels"></div>
    <div class="chips" id="consonants"></div>
    <div class="lbl">Şapkadan çıkacak heceler (otomatik türetilir, istersen düzenle):</div>
    <textarea id="heceList" rows="2">An, Na, Ana, Nana, Anan</textarea>
    <div class="opts">
      <label><input type="checkbox" id="optLower" checked> Küçük harfli halleri de çıksın (an, na…)</label>
      <label><input type="checkbox" id="optLetters" checked> Harfler de tek tek çıksın (A, a, N, n)</label>
      <label><input type="checkbox" id="optNums" checked> 1 ve 2 sayıları da çıksın</label>
      <span>Hece sayısı:</span>
      <span class="seg" id="countSeg"><button data-n="10">10</button><button data-n="20" class="on">20</button><button data-n="30">30</button></span>
    </div>
    <button class="btn" id="startBtn">🎩 Başla</button>
    <div class="warn" id="warn"></div>
  </div>
</div>

<!-- ---------- FİNAL ---------- -->
<div id="win" class="overlay hidden">
  <div class="card">
    <h1>🎉 Tebrikler! 🎉</h1>
    <div class="biglet" id="winLetters">a n</div>
    <p class="sub">Bütün heceleri okudunuz!</p>
    <button class="btn alt" id="againBtn">🔁 Tekrar Oyna</button>
    <button class="btn" id="setupBtn" style="margin-left:8px">⚙️ Harfleri Değiştir</button>
  </div>
</div>

<!-- ---------- OYUN ---------- -->
<div id="game">
  <div id="hud">
    <button class="iconbtn" id="homeBtn" title="Ayarlar">🏠</button>
    <div class="pill">⭐ <span class="num" id="score">0</span><span>/ <span id="goal">20</span></span></div>
    <button class="iconbtn" id="soundBtn" title="Ses">🔊</button>
  </div>
  <div id="stage">
    <div id="cardArea"><div id="hece">na</div></div>
    <div id="clownWrap" title="Şapkaya dokun!">
      <svg id="clown" viewBox="0 0 360 440" xmlns="http://www.w3.org/2000/svg">
        <!-- pelerin -->
        <path d="M58 440 L66 250 Q180 206 294 250 L302 440 Z" fill="#8b1e3f"/>
        <path d="M74 440 L80 262 Q180 226 280 262 L286 440 Z" fill="#c0392b" opacity=".55"/>
        <!-- smokin -->
        <path d="M98 440 L104 262 Q180 236 256 262 L262 440 Z" fill="#1c1c2e"/>
        <path d="M150 262 L180 440 L210 262 Q180 252 150 262 Z" fill="#fff"/>
        <path d="M150 262 L118 340 L170 300 Z" fill="#33334d"/><path d="M210 262 L242 340 L190 300 Z" fill="#33334d"/>
        <circle cx="180" cy="318" r="4.5" fill="#1c1c2e"/><circle cx="180" cy="344" r="4.5" fill="#1c1c2e"/>
        <!-- papyon -->
        <path d="M180 270 L154 257 L154 283 Z" fill="#e63946"/><path d="M180 270 L206 257 L206 283 Z" fill="#e63946"/><circle cx="180" cy="270" r="6.5" fill="#ffd166"/>
        <!-- boyun, kulaklar, yüz -->
        <rect x="164" y="226" width="32" height="44" rx="12" fill="#f6c9a0"/>
        <circle cx="122" cy="178" r="11" fill="#f6c9a0"/><circle cx="238" cy="178" r="11" fill="#f6c9a0"/>
        <ellipse cx="180" cy="176" rx="60" ry="64" fill="#ffdcb8"/>
        <!-- saç -->
        <path d="M120 160 Q118 112 180 108 Q242 112 240 160 Q236 136 200 134 Q186 144 170 134 Q130 134 120 160 Z" fill="#2b1d3a"/>
        <!-- silindir şapka (başta) -->
        <path d="M136 112 L142 42 Q180 32 218 42 L224 112 Z" fill="#1c1c2e"/>
        <rect x="139" y="92" width="82" height="13" fill="#ffd166"/>
        <ellipse cx="180" cy="112" rx="66" ry="11" fill="#1c1c2e"/>
        <path d="M178 58 L182 68 L193 69 L185 76 L187 87 L178 81 L169 87 L171 76 L163 69 L174 68 Z" fill="#ffd166"/>
        <!-- kaşlar -->
        <path d="M146 150 Q160 142 174 150" stroke="#2b1d3a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <path d="M186 150 Q200 142 214 150" stroke="#2b1d3a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <!-- gözler -->
        <g class="blink" style="transform-origin:180px 172px">
          <ellipse cx="160" cy="172" rx="13" ry="14" fill="#fff"/><ellipse cx="200" cy="172" rx="13" ry="14" fill="#fff"/>
          <circle cx="162" cy="174" r="7.5" fill="#2b4c7e"/><circle cx="202" cy="174" r="7.5" fill="#2b4c7e"/>
          <circle cx="162" cy="174" r="3.5" fill="#111"/><circle cx="202" cy="174" r="3.5" fill="#111"/>
          <circle cx="165" cy="170" r="2.5" fill="#fff"/><circle cx="205" cy="170" r="2.5" fill="#fff"/>
        </g>
        <!-- yanaklar, burun, gülümseme -->
        <circle cx="142" cy="200" r="10" fill="#ff9fb0" opacity=".6"/><circle cx="218" cy="200" r="10" fill="#ff9fb0" opacity=".6"/>
        <path d="M180 184 Q174 198 182 200" stroke="#e0a97e" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M156 212 Q180 236 204 212" stroke="#c0392b" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M162 214 Q180 226 198 214 Z" fill="#fff"/>
        <!-- kollar: sol el asayı kaldırmış -->
        <path d="M116 272 Q70 232 76 168" stroke="#1c1c2e" stroke-width="26" fill="none" stroke-linecap="round"/>
        <circle cx="76" cy="160" r="15" fill="#fff"/>
        <g id="wand"><rect x="72" y="84" width="9" height="84" rx="4.5" fill="#1c1c2e"/><rect x="72" y="84" width="9" height="20" rx="4.5" fill="#fff" stroke="#1c1c2e" stroke-width="1"/></g>
        <!-- sağ el şapkanın kenarında -->
        <path d="M244 272 Q298 304 286 362" stroke="#1c1c2e" stroke-width="26" fill="none" stroke-linecap="round"/>
        <circle cx="284" cy="370" r="15" fill="#fff"/>
        <!-- masa -->
        <rect x="26" y="388" width="308" height="52" fill="#5a2d91"/>
        <path d="M26 440 L26 400 Q56 392 86 400 Q116 408 146 400 Q180 392 214 400 Q244 408 274 400 Q304 392 334 400 L334 440 Z" fill="#6d3fc7"/>
        <rect x="14" y="372" width="332" height="22" rx="9" fill="#9b6ee0"/>
        <!-- sihir şapkası (masada, ağzı açık) -->
        <g id="hat">
          <path d="M124 382 L132 312 L228 312 L236 382 Z" fill="#2a1a4a" stroke="#fff" stroke-width="3"/>
          <rect x="130" y="352" width="100" height="13" fill="#ffd166"/>
          <ellipse cx="180" cy="312" rx="48" ry="10" fill="#0b0b14" stroke="#fff" stroke-width="3"/>
          <ellipse cx="180" cy="312" rx="40" ry="6" fill="#4b2a85"/>
          <ellipse cx="180" cy="382" rx="78" ry="13" fill="#2a1a4a" stroke="#fff" stroke-width="3"/>
        </g>
      </svg>
    </div>
    <button class="btn" id="mainBtn">🎩 Hece Çıkar</button>
    <div id="hint">Şapkaya dokun ya da düğmeye bas</div>
  </div>
</div>
<canvas id="confetti"></canvas>

function applauseUnlock(){ try{ applause.muted=true; const p=applause.play(); if(p&&p.then) p.then(()=>{applause.pause();applause.currentTime=0;applause.muted=false;}).catch(()=>{applause.muted=false;}); }catch(e){} }
function applausePlay(){ if(!soundOn) return; try{ applause.muted=false; applause.currentTime=0; const p=applause.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
$('soundBtn').addEventListener('click', e => { e.stopPropagation(); ensureAudio(); soundOn=!soundOn; $('soundBtn').textContent=soundOn?'🔊':'🔇'; if(master) master.gain.setTargetAtTime(soundOn?1:0, actx.currentTime, 0.05); try{ applause.muted=!soundOn; if(!soundOn) applause.pause(); }catch(e){} });

/* ---------- harf seçimi ve hece türetme ---------- */
const selected = new Set(DEFAULT_ON);
function buildChips(){
  const mk=(list, host, cls)=>{ host.innerHTML=''; list.forEach(l=>{ const b=document.createElement('button'); b.className='chip '+cls+(selected.has(l)?' on':''); b.textContent=l+' '+upper(l);
    b.addEventListener('click',()=>{ selected.has(l)?selected.delete(l):selected.add(l); b.classList.toggle('on'); warnEl.textContent=''; regenerate(); }); host.appendChild(b); }); };
  mk(VOWELS,$('vowels'),'v'); mk(CONSONANTS,$('consonants'),'c');
}
// Seçili harflerden: na, an gibi heceler; a+na (ana), an+an (anan), na+na (nana) gibi birleşimler; sözlükteki basit kelimeler
function generate(){
  const v=VOWELS.filter(x=>selected.has(x)), c=CONSONANTS.filter(x=>selected.has(x));
  const out=[]; const seen=new Set(); const add=s=>{ if(!seen.has(s)){ seen.add(s); out.push(s); } };
  const cv=[], vc=[];
  for(const k of c) for(const a of v){ cv.push(k+a); vc.push(a+k); }
  for(let i=0;i<cv.length;i++){ add(vc[i]); add(cv[i]); }                 // an, na
  for(const a of v) for(const s of cv) add(a+s);                             // ana, ela
  const base=[...vc,...cv];
  let combos=0;
  for(const s1 of base) for(const s2 of base){ if(s1[s1.length-1]===s2[0]) continue; if(++combos>400) break; add(s1+s2); }  // anan, nana, elle…
  const ok=new Set([...v,...c]);
  for(const w of new Set(WORDS)) if(w.length>2 && [...w].every(ch=>ok.has(ch))) add(w);
  return out.map(upper);
}
function regenerate(){ $('heceList').value = generate().join(', '); }
buildChips();
let goal=20;
$('countSeg').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ goal=+b.dataset.n; $('countSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }));
function readList(){
  return $('heceList').value.split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean);
}
function buildPool(){
  const items=readList();
  const pool=[]; const seen=new Set(); const add=s=>{ if(!seen.has(s)){ seen.add(s); pool.push(s); } };
  for(const s of items){ add(s); if($('optLower').checked){ add(s.toLocaleLowerCase('tr')); } }
  if($('optLetters').checked){ for(const l of [...VOWELS,...CONSONANTS]) if(selected.has(l)){ add(l.toLocaleUpperCase('tr')); add(l); } }
  return {pool, items};
}
let queue=[], current=null, score=0, busy=false, lastWasNum=false;
function nextItem(){
  if($('optNums').checked && !lastWasNum && Math.random()<0.22){ lastWasNum=true; return {kind:'sayi', text:pick(['1','2'])}; }
  lastWasNum=false;
  if(queue.length===0){ const {pool}=buildPool(); queue=pool.slice().sort(()=>Math.random()-0.5); }
  return {kind:'hece', text:queue.pop()};
}

/* ---------- oyun akışı ---------- */
function startGame(){
  const {pool}=buildPool();
  if(pool.length===0){ warnEl.textContent='En az bir hece yazmalısın.'; return; }
  warnEl.textContent='';
  ensureAudio(); applauseUnlock();
  try{ applause.pause(); applause.currentTime=0; }catch(e){}
  score=0; scoreEl.textContent='0'; goalEl.textContent=goal; queue=[]; current=null; busy=false;
  heceEl.className=''; heceEl.style.opacity=0; lastWasNum=false;
  mainBtn.textContent='🎩 Hece Çıkar';
  intro.classList.add('hidden'); win.classList.add('hidden'); game.classList.add('on');
}
function popHece(){
  if(busy) return; busy=true;
  current=nextItem();
  if(current.kind==='sayi'){ heceEl.innerHTML=current.text+'<small>'+'● '.repeat(+current.text).trim()+'</small>'; heceEl.className='sayi'; }
  else { heceEl.textContent=current.text; heceEl.className=''; }
  void heceEl.offsetWidth;
  heceEl.style.opacity=''; clownWrap.classList.add('open'); popSound(); sparkle();
  setTimeout(()=>{ heceEl.classList.add('pop'); }, 120);
  setTimeout(()=>{ clownWrap.classList.remove('open'); busy=false; mainBtn.textContent='✅ Okudum, Sıradaki'; }, 750);
}
function readDone(){
  if(busy||!current) return; busy=true;
  score++; scoreEl.textContent=score; starSound();
  heceEl.classList.remove('pop'); heceEl.classList.add('fly');
  current=null;
  setTimeout(()=>{ heceEl.className=''; heceEl.style.opacity=0; busy=false;
    if(score>=goal){ endGame(); } else { popHece(); }
  }, 600);
}
function endGame(){
  $('winLetters').textContent=readList().join('  ');
  game.classList.remove('on'); win.classList.remove('hidden');
  applausePlay(); setTimeout(winSound,300); confettiBurst();
}
mainBtn.addEventListener('click', ()=>{ ensureAudio(); current? readDone() : popHece(); });
clownWrap.addEventListener('click', () => { ensureAudio(); current? readDone() : popHece(); });
$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('setupBtn').addEventListener('click', ()=>{ win.classList.add('hidden'); intro.classList.remove('hidden'); });
$('homeBtn').addEventListener('click', ()=>{ game.classList.remove('on'); intro.classList.remove('hidden'); });

/* ---------- pırıltı ve konfeti ---------- */
function sparkle(){
  const r=clownWrap.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height*0.71;
  const cols=['#ffd166','#ff5d8f','#2bc0a0','#2b9bd6','#fff','#ff6b35'];
  for(let i=0;i<18;i++){ const s=document.createElement('div'); s.className='spark'; s.style.left=cx+'px'; s.style.top=cy+'px'; s.style.background=pick(cols);
    const a=rnd(-Math.PI,0), d=rnd(60,180); s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',Math.sin(a)*d+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),1000); }
}
const cv=$('confetti'), cx2=cv.getContext('2d'); let conf=[], confRun=false;
function confettiBurst(){
  cv.width=innerWidth; cv.height=innerHeight; conf=[];
  const cols=['#ffd166','#ff5d8f','#2bc0a0','#2b9bd6','#ff6b35','#c77dff'];
  for(let i=0;i<220;i++) conf.push({x:rnd(0,cv.width),y:rnd(-cv.height,0),w:rnd(6,12),h:rnd(8,16),c:pick(cols),vy:rnd(120,260),vx:rnd(-40,40),r:rnd(0,6),vr:rnd(-4,4)});
  if(!confRun){ confRun=true; let last=performance.now(); const loop=(t)=>{ const dt=Math.min(0.05,(t-last)/1000); last=t; cx2.clearRect(0,0,cv.width,cv.height); let alive=0;
    for(const p of conf){ p.y+=p.vy*dt; p.x+=p.vx*dt+Math.sin(p.y*0.02)*0.8; p.r+=p.vr*dt; if(p.y<cv.height+20) alive++; cx2.save(); cx2.translate(p.x,p.y); cx2.rotate(p.r); cx2.fillStyle=p.c; cx2.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx2.restore(); }
    if(alive>0) requestAnimationFrame(loop); else { confRun=false; cx2.clearRect(0,0,cv.width,cv.height); } }; requestAnimationFrame(loop); }
}
})();
</script>
