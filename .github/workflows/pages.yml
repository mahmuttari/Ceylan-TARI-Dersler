name: GitHub Pages

# Pages sitesi gh-pages dalından yayınlanır; bu iş akışı main içeriğini
# her gönderimde gh-pages dalına kopyalar.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: main dalını gh-pages dalına gönder
        run: git push --force origin HEAD:gh-pages
