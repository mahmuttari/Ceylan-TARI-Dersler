<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceylan Tarı – Dersler</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
    font-family:"Comic Sans MS","Chalkboard SE","Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;
    background:radial-gradient(ellipse at 50% 20%,#9fe3ff 0%,#3fb3ea 45%,#0e5a92 100%);color:#0b3b5c}
  .card{background:rgba(255,255,255,.94);border-radius:28px;padding:28px;max-width:560px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,40,80,.35)}
  .teacher{font-size:clamp(18px,3.4vw,26px);font-weight:700;color:#0b5c8f;background:#e6f6ff;border-radius:999px;
    padding:10px 22px;display:inline-block;margin-bottom:14px}
  .teacher small{display:block;font-size:.72em;color:#2a7fb3;margin-top:2px}
  h1{margin:4px 0 18px;font-size:clamp(26px,5vw,38px);color:#083a5e}
  a.game{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;font-weight:800;
    font-size:clamp(18px,3.2vw,24px);background:linear-gradient(180deg,#ff9f43,#ff6b35);border-radius:18px;
    padding:16px 20px;box-shadow:0 8px 0 #c74d1f,0 14px 30px rgba(0,0,0,.2);margin:10px 0}
  a.game span{font-size:1.6em}
  a.game:active{transform:translateY(5px);box-shadow:0 3px 0 #c74d1f}
</style>
</head>
<body>
  <div class="card">
    <div class="teacher">Ceylan Tarı<small>Birinci Sınıf Öğretmeni</small></div>
    <h1>Eğitici Oyunlar</h1>
    <a class="game" href="n-harfi-akvaryum/"><span>🐠</span> N Harfi Akvaryumu</a>
  </div>
</body>
</html>
